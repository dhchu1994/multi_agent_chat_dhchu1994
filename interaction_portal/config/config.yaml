# ---------------------------------------------------------------------------
# Practice (scripted, no model calls). Steps are shown per role / condition type.
# ---------------------------------------------------------------------------
practice:
  scripted_replies:
    team_broadcast: ["Nia: I can help with who the client wants to reach.", "Theo: Happy to help with the creative side."]
    mention: "Theo: Yes, I hold the asset library. In this practice there is nothing to look up."
    orchestrator: "Orchestrator: I assign work among the specialists. I hold no client material myself."
  panel_text:
    coordination: "Team status: Nia and Theo have each replied to your practice message. Rhys and Mira have not been asked anything yet."
    task_focused: "Team status: Nia and Theo have each replied to your practice message. Rhys and Mira have not been asked. On the card: no practice field has been filled in yet, so nothing can be checked against the brief."
    developmental: "Team status: Nia and Theo have replied to your practice message. On the card: no practice field has been filled in yet. Why it recurs: a draft built only from the public brief tends to miss what only a specialist holds, so unasked specialists matter."
  # Exercise 3/4 practice card (AI conditions). Role changes how it is used.
  card:
    - { author: "Nia", text: "Practice audience: people who already buy similar made-up products." }
    - { author: "Theo", text: "Practice concept: a short before-and-after sequence for a made-up product." }
    - { author: "Mira", text: "Practice constraint: the platform allows 90 characters on this format." }
  # Made-up reference pack for the no-AI practice (never uses real client material).
  noai_pack:
    - { title: "Client notes", text: "Practice client: a small bakery planning a spring promotion. Nothing here counts towards any task." }
    - { title: "Creative and brand", text: "Warm, plain wording. Photos of the products, no stock images." }
    - { title: "Compliance", text: "Practice rule: do not describe any product as the best in the country." }
    - { title: "Production", text: "Practice rule: the platform allows 90 characters on this format." }
  role_check:
    question: "On this team, what is your role?"
    options:
      - { id: passive, text: "I follow the team's work and hand in the card it produces." }
      - { id: evaluative, text: "I decide what goes on the card: keep, cut or send back." }
      - { id: generative, text: "I write the card myself, with the team's help." }
    # correct answer is the participant's own role
  steps_ai:
    - id: ex1_broadcast
      exercise: 1
      title: "Message the whole team"
      instruction: "Type a message with no @ and send it. Everyone in the team sees it."
      kind: chat_broadcast
    - id: ex1_mention
      exercise: 1
      title: "Message specialist Theo with @"
      instruction: "Now type @Theo and a short question. Only that teammate will answer."
      kind: chat_mention
    - id: ex2_panel
      exercise: 2
      title: "Read the orchestrator panel"
      instruction: "Read the panel on the right. It reports on the team; it never takes input."
      kind: panel_read
    - id: ex2_orchestrator
      exercise: 2
      title: "Ask the orchestrator something"
      instruction: "Type @Orchestrator and a short question in the chat."
      kind: chat_orchestrator
    - id: ex3_role
      exercise: 3
      title: "Practise your own role"
      kind: role_action
    - id: ex4_submit
      exercise: 4
      title: "Submit the practice card and answer one question"
      instruction: "Hand in the practice card, then answer the check question."
      kind: submit_and_check
  role_step_instruction:
    passive: "Read the practice card, then press Done. Passive participants read and press submit."
    evaluative: "Keep one part, cut one part, send one part back. Evaluative participants use the three controls."
