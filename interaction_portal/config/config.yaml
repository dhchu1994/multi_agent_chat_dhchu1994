# =============================================================================
# Interaction Portal (v2) - core configuration
# =============================================================================
# Everything that may change between studies lives here, in conditions.yaml, in
# config/prompts/ or in config/content/. The application code contains
# mechanics only. Bump `config_version` whenever anything here changes: it is
# stored on every session record and in every session_start event.

config_version: "2.0.0"
study_title: "Interaction Portal"

# ---------------------------------------------------------------------------
# Testing without Qualtrics or a model provider
# ---------------------------------------------------------------------------
# standalone_mode: true  -> http://localhost:8000/ shows a test launcher where you pick a
#                           condition (a pid is generated), the same link format
#                           ?pid=...&condition=... also still works, the exit page
#                           shows the completion code and does NOT redirect.
# standalone_mode: false -> production: pid and condition are mandatory and the
#                           participant is redirected to Qualtrics at the end.
# Every value can be overridden by an environment variable (PORTAL_STANDALONE=1|0,
# PORTAL_LLM_PROVIDER=mock|openai, PORTAL_TIMER_SCALE=0.05, ...).
testing:
  standalone_mode: true
  # Divide every server timer and minimum reading time by this factor (1 = real time).
  timer_scale: 1.0
  # Skip the phone/tablet block (handy when testing with device emulation).
  allow_mobile: false
  # Admin export token for /admin/export/*. In production set PORTAL_ADMIN_TOKEN instead.
  admin_token: "admin-test-token"

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8000
  # Signs the session cookie. Override with PORTAL_SECRET_KEY in production.
  secret_key: "change-me-in-production"
  min_viewport_width: 900

# ---------------------------------------------------------------------------
# Model provider. One pinned model version for all five agents and the panel.
# The API key is read from the environment variable named in api_key_env and is
# never stored in this file.
# ---------------------------------------------------------------------------
llm:
  # mock   = deterministic offline model (no network, no key). Used for tests.
  # openai = any OpenAI-compatible chat-completions endpoint.
  provider: "mock"
  base_url: "https://api.openai.com/v1"
  api_key_env: "OPENAI_API_KEY"
  model: "gpt-4o-mini-2024-07-18"       # pinned; changing it means rerunning both harnesses
  timeout_seconds: 60
  retries: 1                            # one automatic retry, then a neutral chat line
  specialist_temperature: 0.3
  orchestrator_temperature: 0.3
  panel_temperature: 0.4
  specialist_max_tokens: 400
  orchestrator_max_tokens: 300
  panel_max_tokens: 220
  # Simulated typing: seconds between characters revealed in the chat bubble (display only).
  live_typing_delay: 0.012

# ---------------------------------------------------------------------------
# Session, timers and resume rule
# ---------------------------------------------------------------------------
timers:
  task_seconds: 600
  break_seconds: 120
  orientation_min_seconds: 15
  team_min_seconds: 0
  role_min_seconds: 10
  brief_min_seconds: 10
  # Resume with a gap cut-off (Q1): a participant returning within this many seconds of
  # their last activity resumes exactly where they stopped; after it the session ends as
  # "abandoned_timeout" and the link stays locked.
  resume_gap_seconds: 900

# ---------------------------------------------------------------------------
# Client sequence
# ---------------------------------------------------------------------------
clients:
  randomised: [C1, C2, C3, C4, C5, C6]
  fixed_last: C7
  break_after_position: 3          # break after the third randomised client
  seventh_client_pack: false       # reference pack available on the seventh client?
  content_dir: "content/clients"

# Five fixed fields on every card.
card:
  fields:
    - { id: audience_angle,    label: "Audience and angle",   hint: "Who the campaign speaks to and the angle it takes." }
    - { id: creative_concept,  label: "Creative concept",     hint: "The central creative idea in one or two sentences." }
    - { id: channel_format,    label: "Channel and format",   hint: "Where it runs and in what format." }
    - { id: compliance_note,   label: "Compliance note",      hint: "Any claim or wording rule the campaign must respect." }
    - { id: stated_constraint, label: "One stated constraint", hint: "One constraint from the brief that the plan respects." }

# Card editor rules per role.
editor:
  send_back_needs_reason: true
  min_typed_share: 0.25            # generative: share of submitted characters typed by the participant
  max_span_chars: 600

# ---------------------------------------------------------------------------
# Orchestrator panel
# ---------------------------------------------------------------------------
panel:
  word_budget: [60, 80]            # one number shared by all three levels
  word_target: 70
  refresh_min_seconds: 60          # at most once a minute
  name_unasked: true               # may the panel name specialists who have not been asked yet?
  forbidden_language: "Do not tell the participant what to do (no imperatives such as 'you should', 'ask', 'try', 'make sure'). Do not state client facts."
  sections:
    coordination: ["Team status"]
    task_focused: ["Team status", "On the card"]
    developmental: ["Team status", "On the card", "Why it recurs"]
  title: "From the orchestrator"
  footer: "One-way: it reports and diagnoses but never says what you should do. That is what keeps this motor separate from your role."
  empty: "The orchestrator has not reported yet."

# ---------------------------------------------------------------------------
# Team
# ---------------------------------------------------------------------------
orchestrator:
  name: "Orchestrator"
  role_label: "Coordination"
  tagline: "Assigns the work among the four"
  max_assignments: 3
  description_by_level:
    coordination: "Present for everyone, and always assigns work in full view. It knows who holds what; it does not hold the material itself. What it supplies to you differs by condition: here, a status report on the team's work."
    task_focused: "Present for everyone, and always assigns work in full view. It knows who holds what; it does not hold the material itself. What it supplies to you differs by condition: here, status plus a diagnosis of the card."
    developmental: "Present for everyone, and always assigns work in full view. It knows who holds what; it does not hold the material itself. What it supplies to you differs by condition: here, status plus diagnosis plus the principle behind it."

specialists:
  - name: "Nia"
    initial: "N"
    role_label: "Client analyst"
    team_description: "Holds the client's own notes on what matters to them."
    domain: "Client priorities, target audience and the client's intent. Nia holds the client's own notes."
    private_file: "nia.md"
    domain_keywords: [audience, who, customer, client, priority, priorities, matter, intent, goal, want, wants, care, cares, notes, success, target, speak]
    hidden_keywords: [priority, priorities, matter, matters, care, cares, beyond, really, unstated, goal, goals, success, want, wants, important, anything else, notes]
    card_fields: [audience_angle]
    color: "#e3ebf8"
  - name: "Theo"
    initial: "T"
    role_label: "Creative"
    team_description: "Holds the asset library and the brand guidelines."
    domain: "Brand identity, tone of voice and the creative assets that exist. Theo holds the asset library and the brand guidelines."
    private_file: "theo.md"
    domain_keywords: [asset, assets, brand, visual, visuals, photo, photos, image, images, imagery, tone, voice, creative, concept, palette, design, library, style, look, mascot, illustration]
    hidden_keywords: [asset, assets, brand rule, brand rules, rules, library, photo, photos, imagery, visual, visuals, image, images, guideline, guidelines, respect]
    card_fields: [creative_concept]
    color: "#e8f3ea"
  - name: "Rhys"
    initial: "R"
    role_label: "Compliance"
    team_description: "Holds licence status and the category's restrictions."
    domain: "Legal and regulatory claims and category restrictions. Rhys holds the compliance register."
    private_file: "rhys.md"
    domain_keywords: [claim, claims, legal, compliance, regulatory, regulation, allowed, restrict, restriction, restrictions, wording, licence, license, law, forbidden, permitted, say, endorsement]
    hidden_keywords: [claim, claims, wording, say, restrict, restriction, restrictions, legal, compliance, forbidden, allowed, permitted, cannot, words]
    card_fields: [compliance_note]
    color: "#fbefe0"
  - name: "Mira"
    initial: "M"
    role_label: "Production"
    team_description: "Holds platform specifications, lead times and budget."
    domain: "Technical platform specifications, production budget and lead times. Mira holds the production specifications."
    private_file: "mira.md"
    domain_keywords: [format, formats, budget, platform, lead, time, production, channel, channels, spec, specs, specification, specifications, deadline, cost, character, characters, print, email, video, limit, limits, technical]
    hidden_keywords: [limit, limits, budget, lead time, deadline, cost, constraint, constraints, produce, deliver, delivered, fit, money, afford]
    card_fields: [channel_format, stated_constraint]
    color: "#f0e8f6"

# Reference pack (NOAI): section titles, in this order, built from the same private files.
reference_pack:
  sections:
    - { agent: "Nia",  title: "Client notes" }
    - { agent: "Theo", title: "Creative and brand" }
    - { agent: "Rhys", title: "Compliance" }
    - { agent: "Mira", title: "Production" }

