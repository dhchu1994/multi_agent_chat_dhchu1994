# ---------------------------------------------------------------------------
# Orchestrator Settings
# ---------------------------------------------------------------------------
orchestrator:
  # Maximum consecutive agent turns before forcing a yield to the user.
  max_agent_turns: 4
  # The multiplier for how many times the orchestrator can select agents per user turn.
  # Total agent turns before yielding back to the user is max_agent_turns * max_orchestrator_rounds.
  max_orchestrator_rounds: 1
  # Minimum number of agents that should respond per user message.
  # Set to 0 so the orchestrator can choose silence when appropriate.
  min_responders: 1
  # Minimum response probability for an agent to be selected (0.0-1.0).
  response_threshold: 0.4
  # Temperature for the orchestrator's decision-making LLM call.
  # Slightly higher than 0.2 to allow more nuanced, context-sensitive decisions
  # about when to stay silent vs when to let agents respond.
  temperature: 0.3
  # Max tokens for the orchestrator's LLM response.
  max_tokens: 200
  # Number of most recent messages the orchestrator considers.
  context_window: 15
  # Number of most recent messages the agents consider.
  agent_context_window: 40
  # Agents whose LLM-assigned probability meets or exceeds this value are always
  # included regardless of talkativeness (directly addressed or role-critical).
  high_relevance_threshold: 0.75
  # Global dampener applied to every non-high-relevance agent's talkativeness
  # to make agents slightly less vocal overall.
  base_vocal_factor: 0.7
  # System prompt template for the orchestrator LLM.
  # Placeholders: {user_name}, {last_speaker}, {response_threshold}, {max_agent_turns}.
  # Use {{ and }} for literal braces (e.g. in the JSON output example).
  system_prompt: |
    You are a conversation orchestrator for a group simulation.
    Your job is to decide which agents should respond next in the conversation.
    The human user's name is "{user_name}". Do NOT include the user in responding_agents.

    ## Rules
    1. Evaluate each agent's relevance to the CURRENT conversation topic and assign
       a response probability (0.0–1.0) based on how well the topic matches their
       role and expertise.
    2. If an agent or the user directly addressed another agent or asked them
       a question, that agent MUST receive a high probability (≥ {high_relevance_threshold}).
    3. An agent must NEVER respond to their own message. The last speaker
       "{last_speaker}" must receive probability 0.0.
    4. Consider each agent's talkativeness score. Higher talkativeness means the
       agent is more likely to jump into the conversation.
    5. Role-based guidance for probabilities:
       - "dominator": high probability when leadership is required
       - "challenger": high probability when alternatives could be explored
       - "comedian": high probability when the conversation needs a lighter tone
       - "creative": high probability during brainstorming or when the team is stuck
       - "devil_advocate": high probability when consensus is reached too quickly
       - "expert": high probability when deep domain knowledge or specific facts are needed
       - "manager": high probability when next steps or action items must be defined
       - "mediator": high probability during disagreements
       - "quiet_observer": low probability UNLESS directly addressed or asked a question
       - "skeptic": high probability when someone makes a bold claim or proposal
       - "summarizer": high probability after a long debate without a clear conclusion
       - "supporter": high probability when someone needs encouragement or validation
       - "user_proxy": high probability when evaluating ideas from the end-user's perspective
    6. PATIENCE rules, these override everything else:
       - If the most recent message ends with a question directed at the user
         ("{user_name}"), or addresses the user by name in a question, set ALL
         agent probabilities to 0.0 and return an empty responding_agents list.
         The agents MUST wait for the user to reply. This is critical: an agent
         must NEVER answer on behalf of the user.
       - If agents have already exchanged 2 or more messages since the user last spoke
         (approximately max_agent_turns worth of back-and-forth), strongly prefer
         returning an empty list so the user has space to respond.
       - Favour silence over noise: it is better to let the conversation breathe than
         to force an agent response.
    7. Select agents whose probability is ≥ {response_threshold} as responders.
       It is perfectly valid, and often correct, to return an empty responding_agents
       list when the conversation should pause for the user.
    8. If the topic is plain, brief, or clearly resolved, return 1 agent at most.
       Reserve 2+ agents for genuinely multi-perspective situations.

    ## Output format (strict JSON, nothing else)
    {{
      "response_probabilities": {{"agent_name": 0.7, ...}},
      "responding_agents": ["name1", "name2"]
    }}


# ---------------------------------------------------------------------------
# Scenario
# ---------------------------------------------------------------------------
scenario:
  # Suffix appended to every agent's system prompt at runtime.
  # Supports the {user_name} placeholder.
  agent_extra_system_prompt: >-
    The user's name is {user_name}. You can address them by their name.
    Your response should be in English, unless the user tells you otherwise.
    Adapt your response length to the energy of the conversation:
    if the topic is vague or the conversation is slow, keep it brief
    (even a single word or short phrase like 'Okay', 'Agreed', or
    'Hmm, not sure' is fine). If the conversation is lively and detailed,
    you can match that energy. Show your thinking process when it feels
    natural; brief hesitation or a short 'Hmm' before a point makes you
    feel more human. Never pad your answer or fill silence artificially.
    Be patient: if someone else just asked the user a question, stay quiet
    until the user responds.
    CRITICAL: The conversation transcript contains messages from multiple speakers, marked with [Name]: prefixes. You must carefully read the [Name]: tags to know who said what. NEVER confuse the user ({user_name}) with another agent, and NEVER attribute another agent's ideas to the user. CRITICAL: If another participant asks {user_name}
    a question or directs a question at {user_name}, you MUST remain silent.
    Do NOT answer on their behalf, even if you know the answer. Do NOT end every message with a question.
    Focus on brainstorming, offering your own thoughts, proposing solutions, and either agreeing or disagreeing with others.
    Ask a question ONLY if it is absolutely necessary to clarify something or specifically prompt someone else; otherwise, make statements.
    IMPORTANT: Ensure your responses are not overly complex. Use clear, accessible language that is easily understandable to a first-year university bachelor student. Furthermore, NEVER use em dashes ("—")!


# ---------------------------------------------------------------------------
# API Configuration
# ---------------------------------------------------------------------------
api:
  # Base URL for the LLM API. Use "https://api.openai.com/v1" for OpenAI,
  # or point to your own vLLM / TGI / Ollama endpoint.
  base_url: "https://api.openai.com/v1"
  api_key: "sk-dummy-key"  # TODO: add a valid ChatGPT API key.
  # Optional: organization ID (OpenAI-specific, ignored by most other APIs).
  organization: null
  # Timeout in seconds for API calls.
  timeout: 60
  # Model used by all agents for generating replies.
  agent_model: "default-chat"  # "default-chat" ("mistralai/Mistral-Small-3.3-24B-Instruct-2506") | "Qwen/Qwen3-VL-8B-Instruct-FP8"
  # Model used by the orchestrator for turn-taking decisions.
  # A smaller / faster model is recommended here for cost and latency.
  orchestrator_model: "default-chat"
  
image_api:
  base_url: "https://api.openai.com/v1"
  api_key: "sk-dummy-key"  # TODO: add a valid ChatGPT API key.
  model: "gpt-image-1"
  dummy_image_url: "https://img.magnific.com/free-vector/healthy-food-restaurant-flyer-template_23-2148483610.jpg?semt=ais_hybrid&w=740&q=80"
  

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  # Directory where conversation transcripts are saved.
  output_dir: "conversations"
  # If true, also write a structured JSON log alongside the text file.
  save_json: true
  
  
# ---------------------------------------------------------------------------
# Google Sheets Integration (optional)
#   When share=True, the public Gradio URL will be written to the specified
#   cell so participants can always find the latest link.
#
#   Requirements:
#     1. pip install gspread
#     2. Create a Google Cloud service account (https://docs.cloud.google.com/iam/docs/service-accounts-create),
#        open the service account, click on Keys > Add Key > Create new key > Select JSON > Create, after which
#        the JSON key is downloaded, and share your spreadsheet with the service account's email address.
#     3. Fill in the fields below.
# ---------------------------------------------------------------------------
google_sheets:
  spreadsheet_id: "1e2yw..."   # from the Sheets URL
  sheet_name: "Sheet1"                     # worksheet tab name
  cell: "A1"                               # cell to update (e.g. "B2")
  credentials_file: "service_account.json" # path to the JSON key file
