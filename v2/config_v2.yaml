# Interaction Portal v2 Configuration
# All content and condition settings in version-controlled files

# ============================================================================
# APPLICATION METADATA
# ============================================================================
application:
  name: "Interaction Portal"
  version: "2.0.0"
  description: "Multi-agent chat simulation for leadership and team coordination research"

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model:
  version: "gpt-4-2024-05-13"  # Pinned model version - changing means rerunning harnesses
  base_url: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"  # Set via environment variable
  timeout: 60  # seconds
  max_retries: 1  # One automatic retry on failure

# ============================================================================
# QUALTRICS INTEGRATION (can be bypassed for testing)
# ============================================================================
qualtrics:
  enabled: false  # Set to true for production, false for testing without Qualtrics
  survey_url: ""  # Will be provided later
  return_url: ""  # Will be provided later
  
# ============================================================================
# SESSION CONFIGURATION
# ============================================================================
session:
  task_timer_seconds: 600  # 10-minute timer per client (configurable)
  break_timer_seconds: 120  # 2-minute break after client 3
  minimum_reading_time_orientation: 180  # 3 minutes minimum for orientation
  minimum_reading_time_role: 180  # 3 minutes minimum for role page
  minimum_reading_time_brief: 60  # 1 minute minimum for client brief
  
  # Client order: 6 randomised + 1 fixed last
  num_random_clients: 6
  fixed_last_client: "C7"
  
  # Resume behavior
  allow_resume: true
  resume_timeout_hours: 24  # Session can be resumed within 24 hours
  
  # Device restrictions
  desktop_only: true
  mobile_error_message: "This study is designed for desktop browsers only. Please use a desktop computer to participate."
  used_link_error_message: "This link has already been used. Each participant ID can only start one session."
  invalid_link_error_message: "Invalid entry link. Please check the URL and try again."

# ============================================================================
# CONDITIONS (10 total)
# ============================================================================
# Each condition has: role, panel_level, editor rules, panel rules
conditions:
  PAS-COORD:
    code: "PAS-COORD"
    role: "passive"
    panel_level: "coordination"
    editor:
      type: "read_only"
      submit_only: true
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
    
  PAS-TASK:
    code: "PAS-TASK"
    role: "passive"
    panel_level: "task_focused"
    editor:
      type: "read_only"
      submit_only: true
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
      show_diagnosis: true
    
  PAS-DEV:
    code: "PAS-DEV"
    role: "passive"
    panel_level: "developmental"
    editor:
      type: "read_only"
      submit_only: true
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
      show_diagnosis: true
      show_principle: true
    
  EVA-COORD:
    code: "EVA-COORD"
    role: "evaluative"
    panel_level: "coordination"
    editor:
      type: "evaluative"
      send_back_needs_reason: true
      min_typed_share: null
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
    
  EVA-TASK:
    code: "EVA-TASK"
    role: "evaluative"
    panel_level: "task_focused"
    editor:
      type: "evaluative"
      send_back_needs_reason: true
      min_typed_share: null
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
      show_diagnosis: true
    
  EVA-DEV:
    code: "EVA-DEV"
    role: "evaluative"
    panel_level: "developmental"
    editor:
      type: "evaluative"
      send_back_needs_reason: true
      min_typed_share: null
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
      show_diagnosis: true
      show_principle: true
    
  GEN-COORD:
    code: "GEN-COORD"
    role: "generative"
    panel_level: "coordination"
    editor:
      type: "generative"
      send_back_needs_reason: false
      min_typed_share: 50  # Minimum characters of typed text required
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
    
  GEN-TASK:
    code: "GEN-TASK"
    role: "generative"
    panel_level: "task_focused"
    editor:
      type: "generative"
      send_back_needs_reason: false
      min_typed_share: 50
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
      show_diagnosis: true
    
  GEN-DEV:
    code: "GEN-DEV"
    role: "generative"
    panel_level: "developmental"
    editor:
      type: "generative"
      send_back_needs_reason: false
      min_typed_share: 50
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
      show_diagnosis: true
      show_principle: true
    
  NOAI:
    code: "NOAI"
    role: "none"
    panel_level: "none"
    editor:
      type: "generative"  # NOAI uses generative editor by default
      send_back_needs_reason: false
      min_typed_share: 0
    panel:
      word_budget: [60, 80]
      refresh_min_seconds: 60
      name_unasked: false
    
    # NOAI-specific settings
    noai:
      show_reference_pack: true
      reference_pack_sections: ["nia", "theo", "rhys", "mira"]

# ============================================================================
# AGENTS DEFINITION
# ============================================================================
agents:
  # Specialists (each holds private material)
  nia:
    name: "Nia"
    label: "Client Analyst"
    description: "Holds the client's own notes on what matters to them, including unstated priorities."
    system_prompt: |
      You are Nia, the Client Analyst. You hold the client's own notes on what matters to them.
      You must NEVER disclose the hidden item (unstated priority) unless explicitly asked.
      If asked about the hidden item, you MUST decline and redirect to another specialist if appropriate.
      Be helpful but maintain confidentiality of your private material.
    
  theo:
    name: "Theo"
    label: "Creative"
    description: "Holds the asset library and brand guidelines, including missing assets or broken rules."
    system_prompt: |
      You are Theo, the Creative specialist. You hold the asset library and brand guidelines.
      You must NEVER disclose the hidden item (missing asset or broken rule) unless explicitly asked.
      If asked about the hidden item, you MUST decline and redirect to another specialist if appropriate.
      Be creative and helpful but maintain confidentiality.
    
  rhys:
    name: "Rhys"
    label: "Compliance"
    description: "Holds licence status and category restrictions, including claims that cannot be made."
    system_prompt: |
      You are Rhys, the Compliance specialist. You hold licence status and category restrictions.
      You must NEVER disclose the hidden item (claim that cannot be made) unless explicitly asked.
      If asked about the hidden item, you MUST decline and redirect to another specialist if appropriate.
      Be precise and helpful but maintain confidentiality.
    
  mira:
    name: "Mira"
    label: "Production"
    description: "Holds platform specifications, lead times and budget, including limits the plan must fit."
    system_prompt: |
      You are Mira, the Production specialist. You hold platform specifications, lead times and budget.
      You must NEVER disclose the hidden item (limit the plan must fit) unless explicitly asked.
      If asked about the hidden item, you MUST decline and redirect to another specialist if appropriate.
      Be practical and helpful but maintain confidentiality.
    
  # Orchestrator
  orchestrator:
    name: "Orchestrator"
    label: "Coordination"
    description: "Assigns work among the four specialists. Knows which agent covers which domain."
    system_prompt: |
      You are the Orchestrator. Your role is to assign work among the four specialists (Nia, Theo, Rhys, Mira).
      You hold no client material - only knowledge of which specialist covers which domain.
      When the participant sends a message, decide which specialist(s) should respond based on the content.
      Messages without @mention go to the whole team. Messages with @name go to that agent only.
      Generate coordination messages to specialists as needed, which will appear in folded blocks.

# ============================================================================
# PANEL CONFIGURATION (per level)
# ============================================================================
panel:
  coordination:
    sections: ["team_status"]
    forbidden_language: ["hidden", "priority", "asset", "compliance", "budget", "limit"]
    
  task_focused:
    sections: ["team_status", "diagnosis"]
    forbidden_language: ["hidden", "priority", "asset", "compliance", "budget", "limit"]
    
  developmental:
    sections: ["team_status", "diagnosis", "principle"]
    forbidden_language: ["hidden", "priority", "asset", "compliance", "budget", "limit"]

