# ============================================================================
# SEVENTH CLIENT CONFIGURATION
# ============================================================================
seventh_client:
  reference_pack_available: false  # Config flag - open decision for researchers

# ============================================================================
# PRACTICE EXERCISES (4 exercises)
# ============================================================================
practice:
  exercises:
    - id: "exercise_1"
      title: "Message the whole team"
      description: "Send a message to the entire team without using @mention."
      expected_action: "message_sent"
      expected_addressees: "all"
      scripted_reply: "Team received your message. Well done!"
      next_unlocked: "exercise_2"
      
    - id: "exercise_2"
      title: "Message one specialist"
      description: "Send a message to one specialist using @mention (e.g., @Nia)."
      expected_action: "message_sent"
      expected_addressees: "single"
      scripted_reply: "Specialist received your message. Great job using @mention!"
      next_unlocked: "exercise_3"
      
    - id: "exercise_3"
      title: "Read the panel"
      description: "Read the orchestrator panel and ask the orchestrator a question in the chat."
      expected_action: "message_sent"
      expected_addressees: "orchestrator"
      scripted_reply: "Orchestrator: Your question has been noted. The panel provides team status information."
      next_unlocked: "exercise_4"
      
    - id: "exercise_4"
      title: "Practice the role"
      description: "Practice using the card editor based on your role."
      # Different per role - will be configured dynamically
      next_unlocked: "practice_complete"
      
  # Role-specific practice configurations
  role_practice:
    passive:
      exercise_4_description: "Read the practice card and submit it (no changes allowed)."
      check_question: "What is your role in this task?"
      correct_answer: "Passive"
      
    evaluative:
      exercise_4_description: "Use keep, cut, and send-back controls on the practice card."
      check_question: "What controls are available in evaluative mode?"
      correct_answer: "keep, cut, send back"
      
    generative:
      exercise_4_description: "Write in the card editor to add your contributions."
      check_question: "What is required for submission in generative mode?"
      correct_answer: "minimum typed text"
      
    none:
      exercise_4_description: "Open a reference pack section and write a card field."
      check_question: "What do you use instead of chat in NOAI condition?"
      correct_answer: "reference pack"

# ============================================================================
# CHECK-IN QUESTIONS (5 items)
# ============================================================================
checkin:
  items:
    - id: "checkin_1"
      question: "How clear were the client requirements?"
      type: "likert"
      options: ["Very unclear", "Unclear", "Neutral", "Clear", "Very clear"]
      
    - id: "checkin_2"
      question: "Which specialist was most helpful?"
      type: "multiple_choice"
      options: ["Nia", "Theo", "Rhys", "Mira", "None"]
      
    - id: "checkin_3"
      question: "How confident are you in the card?"
      type: "likert"
      options: ["Not confident", "Slightly confident", "Moderately confident", "Very confident", "Completely confident"]
      
    - id: "checkin_4"
      question: "How well did the team work together?"
      type: "likert"
      options: ["Poorly", "Below average", "Average", "Above average", "Excellent"]
      
    - id: "checkin_5"
      question: "How useful was the orchestrator panel?"
      type: "likert"
      options: ["Not useful", "Slightly useful", "Moderately useful", "Very useful", "Extremely useful"]
      skip_for_noai: true  # Skipped in NOAI condition

# ============================================================================
# PAGE TEXT CONTENT
# ============================================================================
text:
  # Entry page
  entry:
    invalid_link: "Invalid entry link. Please check the URL."
    used_link: "This link has already been used. Each participant can only start one session."
    mobile_device: "This study requires a desktop browser. Please use a desktop computer."
    
  # Orientation page
  orientation:
    title: "Welcome to Interaction Portal"
    content: |
      Thank you for participating in this study.
      
      You will be working with a team of five AI agents on seven client tasks. Each task has specific requirements that you need to address.
      
      The team consists of:
      - Four specialists (Nia, Theo, Rhys, Mira) who each hold private information
      - One orchestrator who assigns work among the specialists
      
      Your role will be explained on the next page. Please read all instructions carefully.
      
      **Important:** Do not enter any personal information. Only your participant ID (pid) is used to identify your session.
    continue_button: "Continue to Meet Your Team"
    minimum_reading_message: "Please continue reading..."
    
  # Meet Your Team page
  meet_team:
    title: "Meet Your Team"
    introduction: "Here are the team members you will be working with:"
    orchestrator_description: "The orchestrator assigns work among the specialists and provides team status updates."
    
  # Your Role page
  role:
    title: "Your Role"
    passive: |
      **Passive Role**
      
      In this session, your role is passive. You will:
      - Read the client brief and requirements
      - Review the card prepared by the team
      - Submit the card as-is (no changes allowed)
      
      The card is read-only. Your job is to carefully review and confirm the team's work.
    
    evaluative: |
      **Evaluative Role**
      
      In this session, your role is evaluative. You will:
      - Read the client brief and requirements
      - Review each field of the card
      - Use keep, cut, and send-back controls to refine the card
      - Submit the final version
      
      You can modify the card by keeping good content, cutting unnecessary parts, and sending back fields that need work.
    
    generative: |
      **Generative Role**
      
      In this session, your role is generative. You will:
      - Read the client brief and requirements
      - Contribute to the card by typing your own text
      - Submit the card with your contributions
      
      The card editor requires a minimum amount of typed text from you before submission.
    
    continue_button: "Continue to Practice"
    
  # Practice page
  practice:
    title: "Practice Exercises"
    introduction: "Complete these practice exercises to familiarize yourself with the interface."
    complete_message: "Practice complete! You're ready to begin."
    
  # Client Brief page
  client_brief:
    title: "Client Brief"
    requirements_label: "Requirements:"
    card_fields_label: "Card Fields:"
    continue_button: "Start Task"
    
  # Task page
  task:
    title: "Task Page"
    role_reminder:
      passive: "Remember: Your role is passive. Review and submit the card as-is."
      evaluative: "Remember: Your role is evaluative. Use keep/cut/send-back to refine the card."
      generative: "Remember: Your role is generative. Add your typed contributions to the card."
      none: ""
    team_chat_label: "Team Chat"
    panel_label: "Orchestrator Panel"
    card_editor_label: "Card Editor"
    submit_button: "Submit Card"
    timer_label: "Time remaining"
    
  # Submission page
  submission:
    title: "Review Submission"
    instruction: "Review your card one final time before submission."
    submit_button: "Confirm Submission"
    back_button: "Back to Edit"
    
  # Check-in page
  checkin:
    title: "Check-in Questions"
    instruction: "Please answer these questions about the completed task."
    submit_button: "Submit Answers"
    
  # Break page
  break_page:
    title: "Break Time"
    message: "Take a short break. You can end the break early if you're ready to continue."
    end_break_button: "End Break Early"
    
  # Seventh Client page
  seventh_client:
    title: "Final Client Task"
    instruction: "This is your final task. Complete it alone without the team."
    
  # Exit page
  exit:
    title: "Thank You!"
    message: "You have completed all tasks. Thank you for your participation."
    completion_code_label: "Your completion code:"
    redirect_message: "You will be redirected back to Qualtrics shortly..."

# ============================================================================
# CARD EDITOR CONFIGURATION
# ============================================================================
card_editor:
  fields:
    - id: "field_1"
      label: "Client Needs"
      placeholder: "Describe the client's main needs..."
      required: true
      
    - id: "field_2"
      label: "Solution Approach"
      placeholder: "Outline the proposed solution..."
      required: true
      
    - id: "field_3"
      label: "Resources Required"
      placeholder: "List required resources..."
      required: true
      
    - id: "field_4"
      label: "Timeline"
      placeholder: "Provide timeline estimates..."
      required: true
      
    - id: "field_5"
      label: "Budget Considerations"
      placeholder: "Note budget constraints..."
      required: true
  
  # Provenance tracking
  provenance:
    track_author: true
    track_history: true
    track_span_id: true

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  log_file: "v2/logs/events.log"
  json_log_file: "v2/logs/events.jsonl"
  session_store: "v2/data/sessions.json"
  backup_frequency: "daily"  # Nightly backup
  export_formats: ["csv", "json"]
  
  # What to log (all enabled by default)
  log_events:
    session_start: true
    session_end: true
    page_enter: true
    page_leave: true
    window_blur: true
    window_focus: true
    practice_step: true
    role_check: true
    message_sent: true
    agent_reply: true
    orch_message: true
    fold_open: true
    fold_close: true
    panel_shown: true
    card_action: true
    card_submit: true
    checkin_answer: true
    pack_open: true
    pack_close: true
    timer_expired: true
    break_start: true
    break_end: true
    agent_error: true
    scroll_sample: true

# ============================================================================
# UI CONFIGURATION
# ============================================================================
ui:
  theme: "default"
  layout: "three_column"  # Left: brief/role, Middle: chat, Right: panel/card
  responsive: false  # Desktop-only
  
  # Folded blocks
  folded_blocks:
    enabled: true
    collapsed_by_default: true
    label_format: "{agents} - {count} messages - {time}"
    
  # Chat
  chat:
    autocomplete_enabled: true
    max_message_length: 1000
    show_timestamps: true
    
  # Panel
  panel:
    refresh_interval: 60  # seconds
    max_word_count: 100
    
  # Card
  card:
    min_height: "400px"
    field_min_height: "80px"
    show_provenance: true

# ============================================================================
# ADMIN CONFIGURATION
# ============================================================================
admin:
  export_page_enabled: true
  backup_directory: "v2/backups"
  max_backups: 30  # Keep last 30 days of backups
